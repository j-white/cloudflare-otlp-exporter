[package]
name = "cloudflare-otlp-exporter"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.93"

[lib]
crate-type = ["cdylib"]

[dependencies]
graphql_client = "0.16.0"
serde = "1.0.228"
worker = "0.7.4"
reqwest = { version = "0.13.1", features = ["json"] }
opentelemetry = { version = "=0.31.0", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version="=0.31.0", default-features = false, features = ["metrics"] }
getrandom = { version = "0.3.3", default-features = false, features = ["wasm_js"] }
serde_json = "1.0.117"
opentelemetry-otlp = { version="0.31.0", default-features = false, features = ["metrics", "http-proto"] }
opentelemetry-proto = { version = "0.31.0", default-features = false, features = ["metrics", "with-serde"] }
prometheus = "0.14.0"
web-time = "1.1.0"
chrono = "0.4.38"
prost = "0.14.3"
tokio = { version = "1.49.0", default-features = false, features = ["time", "sync"] }

[profile.release]
opt-level = "s" # optimize for size in release builds
lto = true
strip = true
codegen-units = 1
